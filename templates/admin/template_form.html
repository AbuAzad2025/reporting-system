{% extends "base.html" %}
{% block title %}{% if tpl %}تعديل قالب{% else %}قالب جديد{% endif %}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-3xl shadow p-6">
  <h1 class="font-extrabold text-lg text-navy">{% if tpl %}✏️ تعديل «{{ tpl.name_ar }}»{% else %}➕ قالب جديد{% endif %}</h1>
  <form method="POST" class="space-y-4 mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if not tpl %}
    <div>
      <label class="font-bold text-sm" for="f-key">المفتاح اللاتيني * (بدون مسافات: daily / safety ...)</label>
      <input id="f-key" name="key" required dir="ltr" class="form-control w-full text-left" placeholder="variation">
    </div>
    {% endif %}
    <div>
      <label class="font-bold text-sm" for="f-name_ar">الاسم العربي *</label>
      <input id="f-name_ar" name="name_ar" required value="{{ tpl.name_ar if tpl }}" class="form-control w-full">
    </div>
    <div>
      <label class="font-bold text-sm" for="f-name_en">الاسم الإنجليزي</label>
      <input id="f-name_en" name="name_en" dir="ltr" value="{{ tpl.name_en if tpl }}" class="form-control w-full text-left">
    </div>
    <div>
      <label class="font-bold text-sm" for="f-description">الوصف</label>
      <textarea id="f-description" name="description" rows="2" class="form-control w-full">{{ tpl.description if tpl }}</textarea>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="font-bold text-sm" for="f-icon">الأيقونة</label>
        <input id="f-icon" name="icon" value="{{ tpl.icon if tpl else '📋' }}" class="form-control w-full">
      </div>
      <div>
        <label class="font-bold text-sm" for="f-gradient">التدرج اللوني</label>
        <select id="f-gradient" name="gradient" class="form-control w-full">
          {% for g in ['from-sky-500 to-blue-700','from-violet-500 to-purple-700','from-amber-500 to-orange-600','from-emerald-500 to-teal-700','from-rose-500 to-red-600','from-slate-500 to-slate-700'] %}
          <option value="{{ g }}" {% if tpl and tpl.gradient==g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <label class="flex items-center gap-2 text-sm font-bold"><input type="checkbox" name="is_active" value="1" {% if not tpl or tpl.is_active %}checked{% endif %} class="w-5 h-5"> قالب مفعّل</label>
    <button class="w-full bg-navy text-white font-extrabold py-4 rounded-2xl">💾 حفظ القالب</button>
  </form>
</div>
{% endblock %}
