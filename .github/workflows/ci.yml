  # ── Security Scan (bandit) ──
  security-scan-bandit:
    name: "Security Scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Python Setup"
        uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: "Install"
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          python -m pip install --force-reinstall --no-cache-dir click==8.5.0
          python -c "import click; ver = click.__version__; assert ver == '8.5.0', f'FAIL: click={ver}, expected 8.5.0'; print(f'PASS: click verified exactly 8.5.0')"
          pip install bandit pip-audit
      - name: "Run Security Scan"
        run: |
          # Production code: every shipped Python file, not just app/.
          # The previous job scanned app/ only, which left config.py, app.py and
          # the whole utils/ package unexamined.
          bandit -r app/ utils/ migrations/ config.py app.py \
            -f json -o bandit-security-report.json || true
          bandit -r app/ utils/ migrations/ config.py app.py \
            -f text -o bandit-security-report.txt || true
          # Tests: also gated, minus the rule ids that are correct-by-design in
          # test code and would otherwise bury real findings in noise —
          #   B101 assert_used        3634  asserts are how tests work
          #   B105/B106/B107          46  fixture passwords, not secrets
          #   B314/B405               4  parses XML the app just wrote itself
          # HIGH and MEDIUM are still blocking for tests/.
          bandit -r tests/ -s B101,B105,B106,B107,B314,B405 \
            -f json -o bandit-tests-report.json || true
      - name: "Audit Dependencies"
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install pip-audit
          # A known CVE in a runtime dependency must fail the build, not wait
          # for a human to read a log.
          pip-audit -r requirements.txt --progress-spinner off
      - name: "Report Security Findings"
        env:
          # A scan finding must stop the pipeline: HIGH and MEDIUM are blocking.
          # LOW stays advisory (none remain in production code).
          BANDIT_FAIL_ON: HIGH,MEDIUM
        run: python .github/scripts/bandit_summary.py bandit-security-report.json
      - name: "Report Test-Tree Findings"
        env:
          BANDIT_FAIL_ON: HIGH,MEDIUM
        run: python .github/scripts/bandit_summary.py bandit-tests-report.json
      - name: "Upload Security Artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-security-report
          path: |
            bandit-security-report.*
            bandit-tests-report.json
          retention-days: 30

  # ── Real PostgreSQL backup/restore (not mock, not SQLite) ──
  postgres-restore:
    name: "PostgreSQL Restore"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azadexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azadexa
      # Set before pytest starts: tests/conftest.py reads this once at import
      # time to decide the engine, so setting it inside a test is too late.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azadexa_test
      AZADEXA_AUTO_CREATE: "0"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "DB Setup"
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d azadexa -c "CREATE DATABASE azadexa_test;"
      - name: "Python Setup"
        uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: "Install"
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          python -m pip install --force-reinstall --no-cache-dir click==8.5.0
          pip install -r requirements.txt pytest
      - name: "Run Real PostgreSQL Restore"
        # A single test, so there is no worker parallelism to control. -n0 is
        # deliberately not used: pytest-xdist is not a declared dependency, and
        # an unrecognised argument would fail the job rather than serialise it.
        run: |
          python -m pytest tests/backup/test_restore_postgresql_real.py \
            -v --tb=short

  # ── Lint & Format (flake8) ──
