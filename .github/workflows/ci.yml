  # ── Coverage Report ──
  coverage-report-combined:
    name: "Coverage Report"
    runs-on: ubuntu-24.04
    # The combined run executes the whole suite in one process. It reached
    # 30 minutes and was cancelled mid-report while the coverage gate itself
    # was passing, so the ceiling is raised rather than the run left to be
    # killed after half an hour of work.
    timeout-minutes: 55
    needs: [crud-serials-validation, e2e-full-lifecycle, isolation-rbac, versioning-archive-pdf, feedback-analytics-remediation, enterprise-projects-finance-ui, storage-images]
    if: success()
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Python Setup"
        uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: "Install"
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          python -m pip install --force-reinstall --no-cache-dir click==8.5.0
          python -c "import click; ver = click.__version__; assert ver == '8.5.0', f'FAIL: click={ver}, expected 8.5.0'; print(f'PASS: click verified exactly 8.5.0')"
          pip install -r requirements.txt pytest pytest-cov
      - name: "Generate Coverage"
        # No PostgreSQL service in this job, so the real restore test is
        # deselected here and executed for real in the postgres-restore job.
        # NB: the explanation lives here, not inside the command below - a `#`
        # comment on a backslash-continued line is swallowed by the shell, which
        # silently drops the rest of the arguments and then tries to execute
        # them as a command.
        run: |
          python -m pytest tests/ --cov=app \
            --cov-report=xml --cov-report=html --cov-report=term-missing \
            --cov-fail-under=80 \
            -k "not test_restore_postgresql_real"
      - name: "Upload Coverage"
        if: success() && hashFiles('coverage.xml') != '' && hashFiles('htmlcov/') != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-py312
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  # ── Front-end Syntax Check ──
  frontend-syntax-check:
    name: "Frontend Syntax"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Python Setup"
        uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: "Install"
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          python -m pip install --force-reinstall --no-cache-dir click==8.5.0
          python -c "import click; ver = click.__version__; assert ver == '8.5.0', f'FAIL: click={ver}, expected 8.5.0'; print(f'PASS: click verified exactly 8.5.0')"
      - name: "Check JS Syntax"
        # Syntax is not behaviour. The old check ran `node --check` and, when
        # it failed, printed a warning and let the job pass anyway - so a broken
        # script reached production with a green build. This one fails.
        #
        # Every script under static/ is checked, by glob rather than by a list.
        # A hand-written list went stale the moment share.js, main.js,
        # profile.js and admin-fields.js were added: they carried the app's
        # share, theme, start-up and profile behaviour, and this job would have
        # reported the front end as syntactically sound without ever opening
        # them. A file that exists is a file that has to parse.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js is required to check the front-end"
            exit 1
          fi
          found=0
          for f in static/js/*.js static/sw.js; do
            [ -f "$f" ] || continue
            found=$((found + 1))
            node --check "$f"
          done
          if [ "$found" -lt 2 ]; then
            echo "::error::expected the JS assets to be present, found $found"
            exit 1
          fi
          echo "checked $found script(s)"

  # ── Front-end behaviour (vitest) ──
  frontend-behaviour-tests:
    name: "Frontend Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Node Setup"
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: "Install"
        run: npm ci --no-audit --no-fund
      - name: "Run vitest"
        # The theme module's tests assert that the attribute the JavaScript
        # writes is the one the stylesheet reads. That pairing is what broke
        # dark mode and nothing else could have caught it.
        run: npx vitest run --reporter=default
