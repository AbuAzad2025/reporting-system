          python -c "import click; ver = click.__version__; assert ver == '8.5.0', f'FAIL: click={ver}, expected 8.5.0'; print(f'PASS: click verified exactly 8.5.0')"
          pip install flake8
      - name: "Run Lint Check"
        run: |
          flake8 app/ tests/ utils/ migrations/ config.py app.py --max-line-length=120 \
            --ignore=E501,E731,W503,E203,F401,F841,E127,E231,E306,E302,E401,F811,E305,E999

