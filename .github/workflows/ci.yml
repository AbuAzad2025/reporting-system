name: "CI — Azadexa — Split Jobs (crud, e2e, isolation, versioning, feedback, enterprise, storage, security, lint, coverage, frontend)"

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  # Re-run the same commit without having to push an empty one. A deleted or
  # timed-out run used to leave the only options as a throwaway commit or no
  # verification at all.
  workflow_dispatch:

# Every job has explicit Install step with click verification — no confusion, exact failure location.
jobs:

  # ── CRUD, Serial Numbers, Validation, Protection ──
  crud-serials-validation:
    name: "CRUD + Serial"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azadexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azadexa
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azadexa_test
      AZADEXA_AUTO_CREATE: "0"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "DB Setup"
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d azadexa -c "CREATE DATABASE azadexa_test;"
      - name: "Python Setup"
        uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: "Install"
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          python -m pip install --force-reinstall --no-cache-dir click==8.5.0
          python -c "import click; ver = click.__version__; assert ver == '8.5.0', f'FAIL: click={ver}, expected 8.5.0'; print(f'PASS: click verified exactly 8.5.0')"
          pip install -r requirements.txt pytest pytest-cov flake8
      - name: "Run Tests"
        run: python -m pytest tests/test_crud.py -v --tb=short --tb=native -k "not test_restore_postgresql_real"

