[pytest]
testpaths = tests
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
    # flask_login 0.6.3 is the newest release that exists and calls
    # datetime.utcnow() internally when it issues a remember-me cookie.
    # Python deprecated that call, so every login that sets the cookie emits
    # a DeprecationWarning from inside site-packages. There is no version to
    # upgrade to and no application code involved, so it is silenced narrowly:
    # this exact module only. Every other warning still shows, and anything new
    # in our own code still surfaces as before.
    ignore::DeprecationWarning:flask_login\.login_manager
