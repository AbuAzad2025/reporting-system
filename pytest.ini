[pytest]
testpaths = tests
filterwarnings =
    # Two third-party warnings remain, and neither can be fixed in this codebase.
    # They are listed here so the reason is recorded rather than rediscovered:
    #
    # 1. LegacyAPIWarning - "The Query.get() method is considered legacy".
    #    Emitted by flask_sqlalchemy's own get_or_404() helper, which calls
    #    Query.get() internally. Calling get_or_404() is a supported API, not a
    #    deprecated act by us, so this must not be an error: it would fail the
    #    suite on correct code. It is reported, not hidden. Removing it would
    #    mean replacing every get_or_404() call with db.session.get() + abort.
    default::sqlalchemy.exc.LegacyAPIWarning
    #
    # 2. DeprecationWarning - "datetime.datetime.utcnow() is deprecated".
    #    flask_login 0.6.3 issues remember-me cookies using utcnow(). 0.6.3 is
    #    the newest release that exists, so there is no version to upgrade to
    #    and no call site in this repository. Ignored for that module only;
    #    any other DeprecationWarning still surfaces.
    ignore::DeprecationWarning:flask_login\.login_manager
